<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Rishabh Bansal, builder, @rishabhcli</title>
  <desc id="heroDesc">A printed card in bone paper and ink with an acid-lime highlight, next to a terminal panel that types a short introduction.</desc>

  <defs>
    <clipPath id="card"><rect x="4" y="4" width="1192" height="422" rx="6"/></clipPath>
    <clipPath id="term"><rect x="668" y="46" width="488" height="338" rx="6"/></clipPath>
    <clipPath id="tickClip"><rect x="56" y="362" width="560" height="30"/></clipPath>

    <clipPath id="t1"><rect x="700" y="94" width="0" height="26"><animate attributeName="width" values="0;0;76;76;76;0" keyTimes="0;0.02;0.09;0.94;0.965;1" dur="17s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="700" y="172" width="0" height="26"><animate attributeName="width" values="0;0;136;136;136;0" keyTimes="0;0.24;0.33;0.94;0.965;1" dur="17s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="700" y="250" width="0" height="26"><animate attributeName="width" values="0;0;112;112;112;0" keyTimes="0;0.50;0.58;0.94;0.965;1" dur="17s" repeatCount="indefinite"/></rect></clipPath>

    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F2EC" stop-opacity="1"/>
      <stop offset="0.08" stop-color="#F4F2EC" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#F4F2EC" stop-opacity="0"/>
      <stop offset="1" stop-color="#F4F2EC" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="430" fill="#F4F2EC"/>

    <g stroke="#11110F" stroke-width="2" opacity="0.45">
      <path d="M26 26 h18 M26 26 v18"/><path d="M1174 26 h-18 M1174 26 v18"/>
      <path d="M26 404 h18 M26 404 v-18"/><path d="M1174 404 h-18 M1174 404 v-18"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="58" y="78" fill="#5C5A55" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6">@RISHABHCLI &#183; FREMONT, CA &#8594; URBANA, IL</text>

      <rect x="50" y="90" width="0" height="60" fill="#D8FF45">
        <animate attributeName="width" values="0;336;336;336;0" keyTimes="0;0.14;0.86;0.95;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="56" y="146" fill="#11110F" font-size="78" font-weight="800" letter-spacing="-3">RISHABH</text>
      <text x="56" y="220" fill="#11110F" font-size="78" font-weight="800" letter-spacing="-3">BANSAL</text>

      <rect x="58" y="240" width="558" height="3" fill="#11110F"/>

      <text x="58" y="276" fill="#11110F" font-size="17" font-weight="650">Builder. Agent systems, local-first tools, hardware that has to work.</text>
      <text x="58" y="302" fill="#5C5A55" font-size="15">Information Sciences + Data Science, minor in CS &#183; UIUC &#8217;30</text>

      <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">
        <g transform="translate(58 322)">
          <rect width="150" height="30" rx="4" fill="#C9F2F8" stroke="#11110F" stroke-width="2"/>
          <text x="75" y="20" text-anchor="middle" fill="#11110F">AGENT SYSTEMS</text>
        </g>
        <g transform="translate(216 322)">
          <rect width="128" height="30" rx="4" fill="#DDF9D5" stroke="#11110F" stroke-width="2"/>
          <text x="64" y="20" text-anchor="middle" fill="#11110F">LOCAL-FIRST</text>
        </g>
        <g transform="translate(352 322)">
          <rect width="186" height="30" rx="4" fill="#FFDDD2" stroke="#11110F" stroke-width="2"/>
          <text x="93" y="20" text-anchor="middle" fill="#11110F">ASSISTIVE HARDWARE</text>
        </g>
      </g>

      <g clip-path="url(#tickClip)">
        <text x="0" y="384" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.6" fill="#5C5A55">
          <animateTransform attributeName="transform" type="translate" from="56 0" to="-708 0" dur="28s" repeatCount="indefinite"/>
          SMARTCANE / ZOOVISION / QAGENT / SAFERELAY / MUSCLE MEMORY / KINORA / MNEMO / FLOWPR / SMARTCANE / ZOOVISION / QAGENT / SAFERELAY / MUSCLE MEMORY / KINORA / MNEMO / FLOWPR /
        </text>
        <rect x="56" y="362" width="560" height="30" fill="url(#tick)"/>
      </g>
    </g>

    <rect x="672" y="50" width="488" height="338" rx="6" fill="#D8FF45"/>
    <g clip-path="url(#term)">
      <rect x="668" y="46" width="488" height="338" fill="#11110F"/>
      <rect x="668" y="46" width="488" height="34" fill="#22221E"/>
      <circle cx="690" cy="63" r="5" fill="#FF5B35"/>
      <circle cx="708" cy="63" r="5" fill="#FFE65B"/>
      <circle cx="726" cy="63" r="5" fill="#D8FF45"/>
      <text x="912" y="67" text-anchor="middle" fill="#8A8A82" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">rishabhcli &#183; zsh</text>

      <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
        <g clip-path="url(#t1)"><text x="700" y="112" fill="#D8FF45">$ <tspan fill="#F4F2EC">whoami</tspan></text></g>
        <text x="700" y="138" fill="#9C9C93" opacity="0">rishabh bansal
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.11;0.13;0.94;0.965;1" dur="17s" repeatCount="indefinite"/>
        </text>

        <g clip-path="url(#t2)"><text x="700" y="190" fill="#D8FF45">$ <tspan fill="#F4F2EC">cat focus.txt</tspan></text></g>
        <text x="700" y="216" fill="#9C9C93" opacity="0">i care about the part after the demo
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.37;0.94;0.965;1" dur="17s" repeatCount="indefinite"/>
        </text>

        <g clip-path="url(#t3)"><text x="700" y="268" fill="#D8FF45">$ <tspan fill="#F4F2EC">ls ~/ships</tspan></text></g>
        <text x="700" y="294" fill="#9C9C93" opacity="0">zoovision  qagent  saferelay
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.94;0.965;1" dur="17s" repeatCount="indefinite"/>
        </text>
        <text x="700" y="316" fill="#9C9C93" opacity="0">musclememory  smartcane  kinora
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.66;0.94;0.965;1" dur="17s" repeatCount="indefinite"/>
        </text>

        <text x="700" y="356" fill="#D8FF45">$</text>
        <rect x="716" y="343" width="9" height="17" fill="#D8FF45">
          <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <rect x="668" y="46" width="488" height="338" rx="6" fill="none" stroke="#11110F" stroke-width="3"/>
  </g>

  <rect x="4" y="4" width="1192" height="422" rx="6" fill="none" stroke="#11110F" stroke-width="4"/>
</svg>
